<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Italy flag">
  <defs>
    <clipPath id="rounded">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112" />
    </clipPath>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.14" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1220" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g clip-path="url(#rounded)">
      <!-- Italy tricolor -->
      <rect x="16" y="16" width="160" height="480" fill="#008C45" />
      <rect x="176" y="16" width="160" height="480" fill="#F4F5F0" />
      <rect x="336" y="16" width="160" height="480" fill="#CD212A" />
      <!-- elegant gloss overlay -->
      <rect x="16" y="16" width="480" height="480" fill="url(#gloss)" />
    </g>
    <!-- crisp inner border -->
    <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" ry="111.5" fill="none" stroke="#0b1220" stroke-opacity="0.10" stroke-width="1" />
  </g>
</svg>
